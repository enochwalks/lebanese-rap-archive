name: Publish site

# Turns GitHub Pages on (enablement: true) and publishes the Storm Watch app.
# Runs itself on every push that touches weather/, so the phone always opens
# the newest version — nothing to download, ever again.

on:
  push:
    branches: [master]
    paths:
      - "weather/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Turn Pages on if it is off
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble the site
        run: |
          mkdir -p _site/weather
          cp weather/index.html _site/weather/index.html
          # the bare domain sends you straight to the app
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=./weather/"><a href="./weather/">Lebanon Storm Watch</a>' > _site/index.html
          ls -la _site _site/weather

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
