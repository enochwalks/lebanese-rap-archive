# Copy to config.toml (git-ignored) and edit. API keys are NEVER written here:
# you name the environment variable that holds the key.

# Where your projects are checked out. `shadow.py fetch` clones into it.
workspace = "~/shadow-projects"

# Optional: point a checkout or a single project somewhere else.
# [checkouts]
# lebanese-rap-archive = "C:/Users/me/Documents/lebanese-rap-archive"
# [paths]
# sigfilter = "~/lebanese-rap-archive/signals"

task_timeout = 900   # seconds a task may run when the shadow runs it for you

# Brains, tried top to bottom; the first that answers is used.
# Delete the ones you don't have. With none reachable, `ask` still answers
# from the registry and runbooks (no AI at all).

# 1. Local, offline, free, no company can switch it off.
#    Install https://ollama.com  then:  ollama pull qwen2.5:14b
#    (smaller PC: qwen2.5:7b or llama3.1:8b)
[[providers]]
type = "ollama"
model = "qwen2.5:14b"
# base_url = "http://localhost:11434"

# 2. Any OpenAI-compatible API. Pick one, set its key in the environment.
[[providers]]
type = "openai"
model = "gpt-4.1"
api_key_env = "OPENAI_API_KEY"

